<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아티스트하우스 리포트 생성기</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="launcher" aria-label="리포트 생성기">
      <div class="launcher__header">
        <div class="launcher__title">
          <h1>아티스트하우스 미술학원 예중/예고 입시반</h1>
          <p>리포트 생성기 v1.2 HTML</p>
        </div>
        <img src="./assets/ArtistHouseLogo.jpg" alt="Artist House" class="launcher__logo">
      </div>

      <h2>사용 방법</h2>
      <p>1. 입력 템플릿 기준 학생 정보와 리포트 시점, 그리고 모든 점수들을 기록 후 저장합니다.</p>
      <a href="./inputTemplate.xlsx" download>템플릿 다운로드</a>
      <p>2. 아래의 "평가서 생성" 버튼을 눌러 템플릿을 불러들이고 인쇄 화면에서 PDF로 저장합니다.</p>

      <div class="actions">
        <button type="button" id="selectFileButton">평가서 생성</button>
        <button type="button" id="printButton" disabled>PDF 저장/인쇄</button>
      </div>
      <input id="inputFile" class="visually-hidden" type="file" accept=".xlsx,.xls">
      <p id="status" class="status" role="status">입력 파일을 선택하세요.</p>
    </section>

    <section id="reportPage" class="report-page" aria-label="정기 리포트" hidden>
      <header class="report-title">
        <img src="./assets/ArtistHouseLogo.jpg" alt="" class="report-logo">
        <h2>예중/예고 입시반 정기 리포트</h2>
      </header>

      <section class="report-summary">
        <div class="student-facts" aria-label="학생 정보">
          <div class="fact">
            <div class="label">이름</div>
            <div class="value" id="studentName"></div>
          </div>
          <div class="fact two-col">
            <div class="label">학교</div>
            <div class="value" id="schoolName"></div>
            <div class="label">학년</div>
            <div class="value" id="grade"></div>
          </div>
          <div class="fact">
            <div class="label">수강기간</div>
            <div class="value" id="studyPeriod"></div>
          </div>
          <div class="fact tall">
            <div class="label">현재<br>지원 가능<br>학교</div>
            <div class="value" id="currentSchools"></div>
          </div>
          <div class="fact tall">
            <div class="label">발전 후<br>지원 가능<br>학교</div>
            <div class="value" id="futureSchools"></div>
          </div>
        </div>

        <div class="evaluation-panel" aria-label="종합 평가">
          <div class="evaluation-title">종합 평가</div>
          <div class="evaluation" id="evaluationText"></div>
        </div>
      </section>

      <div class="standard-title">지원 학교 군의 합격 가능한 입시요소 기준</div>

      <section class="chart-row" aria-label="리포트 그래프">
        <div class="chart-panel">
          <canvas id="gradesChart" width="312" height="240"></canvas>
        </div>
        <div class="chart-panel">
          <canvas id="pentagonChart" width="312" height="240"></canvas>
        </div>
        <div class="chart-panel chart-panel--wide">
          <canvas id="monthlyChart" width="520" height="240"></canvas>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
